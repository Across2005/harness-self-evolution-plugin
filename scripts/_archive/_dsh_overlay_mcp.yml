# _dsh_overlay_mcp.yml — DSH 兼容性测试 overlay（临时，不修改插件仓库与 profile）
# 用 dsh-mcp-client 以 stdio 拉起 harness-evolution.exe。
# failOnStartupError: true → MCP 握手/工具发现失败时 DSH 启动直接失败（强判据）。
- insert:
    - id: mcp-harness-evolution
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: harness-evolution
        command: 'D:/Agent设计/harness-self-evolution-plugin/bin/harness-evolution.exe'
        args: []
        cwd: 'D:/Agent设计/harness-self-evolution-plugin'
        env:
          HARNESS_EVOLUTION_HOST: deepseek-harness
          # 空 = 未设置 → 插件回落 ~/.dsh（裸跑 dsh web 的默认树）。宿主丢弃继承的
          # DSH_*（scrubbedParentEnv），只能在这里显式给；要影响非默认树就填该树的
          # 绝对路径字面量。说明见 cordis.patch.yml 与 store/paths.mbt::dsh_home。
          DSH_HOME: ''
        failOnStartupError: true
