# cordis.patch.yml — DSH bundle patch（loader patch list）。
#
# DSH 方言（实测 0.1.6-alpha.1，见 dsh-app-boot 的 anchorInsertedPluginNames）：
# 顶层必须是 YAML 数组；每个元素是「loader patch entry」，其 `insert` 的值必须是
# **挂载行数组** `[{id, name, config?}]`。`name` = 要挂载的 npm 包名（Loader 解析），
# `id` = 后续 patch 层（profile 的 cordis.patch.yml 或 `--patch` overlay）定位该行的目标。
# 若把元数据映射塞进 `insert`，app-boot 会在 `patch.insert?.forEach` 处抛
# `TypeError: patch.insert?.forEach is not a function`，把整个 profile 打挂（ISSUE-01）。
#
# 本文件不是 plugin.json 的翻译 —— 元数据只存在于 package.json 与 .dsh-plugin/plugin.json。
- insert:
    - id: mcp-harness-evolution
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: harness-evolution
        # 指向构建产物 bin/harness-evolution.exe（build.ps1 -Task build 生成）。
        # 工具公开名由 serverName 决定：mcp__harness-evolution__<tool>。
        # failOnStartupError: true → MCP 握手/工具发现失败时 DSH 启动直接失败（强判据）。
        #
        # ★ H7（硬编码绝对路径）：DSH 的 cordis Loader 不解析相对路径、
        # 不解析 ${ENV_VAR} 插值（实测 @deepseek-ai/dsh-app-boot/lib/index.js），
        # command/cwd 必须是绝对路径字面量。其他仓库路径需用 `scripts/replace-paths.ps1`
        # 替换本文件里的 `D:/Agent设计/harness-self-evolution-plugin` 字符串。
        # 详见 docs/deploy/deepseek-harness.md § Path substitution。
        command: 'D:/Agent设计/harness-self-evolution-plugin/bin/harness-evolution.exe'
        args: []
        cwd: 'D:/Agent设计/harness-self-evolution-plugin'
        env:
          #
          # ★ 缺陷 3c 的另一半：单靠 `paths.mbt` 读 `$DSH_HOME` 不够 —— 这个变量
          # **必须在这里显式转发**，因为宿主 spawn MCP 子进程时用
          # `scrubbedParentEnv()` 丢弃**全部** `DSH_*`（`@deepseek-ai/dsh-subprocess`
          # 的 `DSH_ENV_PREFIX`），继承是拿不到的；只有本行的字面量能在清洗**之后**
          # 被合并进子进程环境（`@deepseek-ai/dsh-mcp-client` 的 `buildChildEnv`）。
          #
          # 值须为**绝对路径字面量**（Loader 不解析 ${ENV_VAR}，见上面的 H7 注释）。
          # 空值 = 未设置 → 插件回落 `~/.dsh`：对「用户 CLI 裸跑 dsh web」的默认树
          # 恰好正确，故留空是**安全默认**。
          # 宿主若 boot 非默认树（例如 Mavis 的 DSH 插件用 `<pluginData>/dsh-home`），
          # 就把它填成那一棵树，插件才会把 user 作用域定义写进宿主真正会读的
          # `<DSH_HOME>/skills/`：
          #
          #   pwsh -File scripts/replace-paths.ps1 -DshHome "$env:DSH_HOME"
          #
          # （-DshHome 缺省取 `$env:DSH_HOME`；非绝对路径会被脚本拒绝，因为那种值
          # 到这里会被插件忽略、看着像生效实则没有。语义见 store/paths.mbt::dsh_home，
          # 部署checklist 见 docs/deploy/deepseek-harness.md § Which tree?）
          DSH_HOME: ''
        failOnStartupError: true
